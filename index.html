<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rhys — Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/sections.css">
    <script src="https://kit.fontawesome.com/cbcb99d2a1.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="nav-bar">
        <a href="#home">Home</a>
        <a href="#featured">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
    </header>

    <main>
        <!--Hero-->
        <section id="home" class="fade-section">
            <div class="header-container">
                <h1 class="typewriter">Hi, I'm Rhys!</h1>
                <h4>Graphics Programmer • Software Developer</h4>
            </div>
        </section>

        <section id="featured" class="fade-section">
            <div class="section-container">
                <h1>Featured Projects</h1>
                <div id="project-list"></div>
            </div>
        </section>

        <!--Experience-->
        <section id="experience" class="fade-section">
            <div class="section-container">
                <h1>Employment</h1>
                <div id="employment-list" class="card-list">
                    <!--certification cards are injected-->
                </div>
                <h1>Education</h1>
                <div id="education-list" class="card-list">
                    <!--education cards are injected-->
                </div>
                <h1>Certifications</h1>
                <div id="certification-list" class="card-list">
                    <!--certification cards are injected-->
                </div>
            </div>
            <div class="cv-container">
                <a href="assets/downloads/rhys-duff-cv.pdf" download>CV</a>
                <i class="fas fa-cloud"></i>
                <i class="fas fa-heart"></i>
                <i class="fas fa-car"></i>
                <i class="fas fa-file"></i>
                <i class="fas fa-bars"></i>
            </div>
        </section>

        <!-- Contact -->
        <section id="contact" class="fade-section">
            <div class="section-container">
                <h1>Contact</h1>
                <div>
                    <form id="contact-form">
                        <label>Name</label>
                        <input type="text" required>
                        <label>Email</label>
                        <input type="email" required>
                        <label>Message</label>
                        <textarea required></textarea>
                        <button type="submit">Send</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Rhys</p>
    </footer>
    <script type="module" src="assets/js/projects.js"></script>
</body>
</html>
