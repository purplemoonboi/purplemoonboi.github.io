<!doctype html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="assets/images/Foundation-Logo.ico">

<body>

    </nav>

  <main>

    <section id="home" class="section-fade">

        </div> -->
        <div class="grid-column">

          </div>
          <div class="flex-column flex-between-left">
            <div>
              <h1 class="typewriter">Hi, I'm Rhys!</h1>
            </div>
            <div>

            </div>
            <div class="hero-actions">

            </div>
          </div>
        </div>

          <i class="fa-solid fa-beat-fade fa-chevron-down" aria-hidden="true"></i>
        </div>
      </div>

    <!--Featured Projects-->

      <div class="section-container">
        <h1>Featured Projects</h1>
        <div class="list-container" id="project-list"></div>
      </div>

    <!--Experience-->
    <section id="experience" class="section-fade">

        </div>

    <section id="contact" class="section-fade">

        <div class="contact-container">
